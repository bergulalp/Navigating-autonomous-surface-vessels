name: Core scientific checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-tested.txt
      - run: python -m pip install -r requirements-tested.txt
      - run: python -m pip install -e . --no-deps
      - run: python -m unittest discover -s tests -v
      - run: python scripts/verify_v4.py
